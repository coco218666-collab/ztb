<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青晟中学侦探部 - ARG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;overflow:hidden}

.iphone-screen{
    width:393px;height:852px;
    background:radial-gradient(circle at 100% 0%,#fcd1a1 0%,transparent 45%),
               radial-gradient(circle at 0% 100%,#c2e9fb 0%,transparent 60%),
               linear-gradient(160deg,#f6b4b8 0%,#e2c3ca 25%,#a1c4fd 50%,#8ec5fc 75%,#e0f2fe 100%);
    border-radius:48px;overflow:hidden;position:relative;
    box-shadow:0 15px 40px rgba(0,0,0,.15),inset 0 0 10px rgba(255,255,255,.5);
    display:flex;flex-direction:column;
    flex-shrink:0;
}

.dynamic-island{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:120px;height:35px;background:#000;border-radius:20px;z-index:3000;
    transition:width .35s cubic-bezier(.2,.9,.3,1);
}
.dynamic-island.wide{width:210px}

.status-bar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 28px 0;color:#fff;font-size:15px;font-weight:600;
    text-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2500;pointer-events:none;
}
.status-right{display:flex;align-items:center;gap:6px}
.battery{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.9);border-radius:4px;position:relative;padding:1.5px}
.battery::after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(255,255,255,.9);border-radius:0 2px 2px 0}
.battery-level{width:80%;height:100%;background:#fff;border-radius:2px}

.home-layer{
    position:absolute;inset:0;display:flex;flex-direction:column;
    transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s;
    z-index:10;
}
.home-layer.hidden{transform:scale(.92);opacity:0;pointer-events:none}

.task-card{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.94);backdrop-filter:blur(20px);
    padding:9px 16px;border-radius:16px;
    font-size:12px;color:#333;box-shadow:0 4px 16px rgba(0,0,0,.12);
    z-index:900;max-width:340px;display:flex;align-items:center;gap:7px;
    pointer-events:none;transition:opacity .3s,transform .3s;
}
.task-card::before{content:'📋';font-size:13px}
.task-card.hidden{opacity:0;transform:translate(-50%,-10px)}

.app-grid{
    display:grid;
    grid-template-columns:repeat(4,62px);
    justify-content:space-between;
    gap:24px 0;
    padding:110px 24px 0;
    position:relative;z-index:10;
    align-content:start;
    flex:1;
}
.app{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s}
.app:active{transform:scale(.9)}
.app-icon{
    width:62px;height:62px;border-radius:14px;
    display:flex;justify-content:center;align-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,.15),inset 0 1px 2px rgba(255,255,255,.4);
    position:relative;overflow:hidden;background:#fff;
}
.app-name{margin-top:6px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:500;white-space:nowrap}
.app-badge{
    position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;
    background:#fa3f3f;color:#fff;font-size:11px;font-weight:700;
    border-radius:10px;display:flex;align-items:center;justify-content:center;
    padding:0 5px;border:2px solid #fff;z-index:5;
}

.icon-calendar{background:#fff}
.icon-browser{background:#fff}
.icon-vv{background:#07c160}
.icon-wall{background:linear-gradient(135deg,#ff6b9d,#ff4d7d)}
.icon-bluebao{background:#1677ff}
.icon-camera{background:#f2f2f7}
.icon-clock{background:#000}
.icon-notes{background:#fff}
.icon-appstore{background:#007aff}
.icon-settings{background:#8e8e93}
.icon-photos{background:#fff}

.bottom-area{
    position:absolute;bottom:0;left:0;width:100%;
    padding:0 15px 35px;display:flex;flex-direction:column;align-items:center;z-index:10;
}
.search-pill{
    background:rgba(255,255,255,.3);backdrop-filter:blur(10px);
    padding:6px 16px;border-radius:20px;color:#fff;font-size:14px;
    margin-bottom:15px;display:flex;align-items:center;gap:5px;
    text-shadow:0 1px 2px rgba(0,0,0,.2);
}
.dock{
    width:100%;background:rgba(255,255,255,.25);
    backdrop-filter:blur(25px);border-radius:35px;
    padding:15px 20px;display:flex;justify-content:space-between;align-items:center;
}
.dock-icon{
    width:62px;height:62px;border-radius:14px;
    display:flex;justify-content:center;align-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,.15),inset 0 1px 2px rgba(255,255,255,.4);
    background:#fff;
}
.dock-phone{background:#34c759}
.dock-safari{background:#fff}
.dock-message{background:#34c759}
.dock-music{background:#ff3b30}

.home-indicator{
    width:140px;height:5px;background:#fff;border-radius:5px;
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    z-index:2400;box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none;
}

.app-view{
    position:absolute;inset:0;z-index:500;
    display:flex;flex-direction:column;
    background:#f2f2f7;
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(.2,.9,.3,1);
    overflow:hidden;
}
.app-view.show{transform:translateY(0)}

.app-top{
    flex-shrink:0;
    padding:54px 14px 12px;
    display:flex;align-items:center;gap:10px;
    font-size:16px;font-weight:600;color:#fff;
    background:#3f5d8a;position:relative;z-index:600;
}
.app-view[data-app="vv"] .app-top{background:#2a8b48}
.app-view[data-app="wall"] .app-top{background:linear-gradient(135deg,#ff6b9d,#ff4d7d)}
.app-view[data-app="bluebao"] .app-top{background:#1677ff}
.app-back{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-size:22px;line-height:1;cursor:pointer;flex-shrink:0;
    border-radius:8px;
}
.app-back:active{background:rgba(255,255,255,.15)}
.app-title{flex:1;font-size:16px;font-weight:600;text-align:center}
.app-action{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-size:16px;cursor:pointer;flex-shrink:0;
}
.app-body{
    flex:1;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;position:relative;
}
.app-body::-webkit-scrollbar{width:0}

.site-nav{
    display:flex;background:#fdfdfe;border-bottom:2px solid #3f5d8a;
    overflow-x:auto;flex-shrink:0;position:sticky;top:0;z-index:20;
}
.site-nav::-webkit-scrollbar{display:none}
.site-nav button{
    flex:0 0 auto;border:0;background:transparent;padding:11px 14px;
    font-size:12.5px;color:#3f5d8a;cursor:pointer;font-family:inherit;
    white-space:nowrap;
}
.site-nav button.on{background:#3f5d8a;color:#fff}
.site-body{padding:18px 18px 80px;font-size:14px;line-height:1.85;color:#1d2027;background:#fff;min-height:100%}
.site-body h1{font-size:19px;margin:0 0 4px}
.site-body h2{font-size:17px;border-left:4px solid #3f5d8a;padding-left:9px;margin:0 0 12px}
.site-body h3{font-size:14px;color:#3f5d8a;margin:16px 0 6px}
.site-body p{margin:7px 0}
.sm{font-size:12px;color:#8b909a;line-height:1.65}
hr{border:0;border-top:1px solid #e8e8ee;margin:12px 0}

.post{border:1px solid #e2e2e9;background:#fdfdff;padding:13px;border-radius:8px;margin:10px 0}
.post-head{display:flex;gap:11px;align-items:flex-start}
.post-title{font-weight:600;font-size:14px}
.post-meta{font-size:11.5px;color:#9a9aa6;margin-top:2px}
.post-body{color:#6a6a78;font-size:13px;margin-top:8px;line-height:1.7}
.reply{background:#f5f5f8;border-left:3px solid #d6d6de;padding:8px 11px;margin-top:7px;font-size:13px;border-radius:0 5px 5px 0}
.reply .t{float:right;color:#b2b2bc;font-size:11px}

.btn{
    font-family:inherit;font-size:13.5px;padding:9px 15px;border:1px solid #c3ccda;
    background:#f6f8fc;color:#33507a;border-radius:7px;cursor:pointer;margin:4px 6px 4px 0;
    transition:.14s;
}
.btn:active{background:#e6ecf6}
.btn.primary{background:#3f5d8a;color:#fff;border-color:#3f5d8a}
.btn.primary:active{background:#34507a}
.btn.wide{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;line-height:1.55}
.btn.done{opacity:.55;border-style:dashed}

.av{
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;font-weight:600;background-size:cover;background-position:center;
    overflow:hidden;
}
.av.sq{border-radius:10px}

.vv-wrap{min-height:100%;background:#f2f2f7;display:flex;flex-direction:column;padding-bottom:60px}
.vv-list{background:#fff;flex:1}
.chat-item{
    display:flex;gap:12px;padding:12px 15px;align-items:center;cursor:pointer;
    border-bottom:1px solid #f3f3f6;transition:.1s;background:#fff;
}
.chat-item:active{background:#f4f4f8}
.chat-item .meta{flex:1;min-width:0}
.chat-item .nm{font-size:14.5px;font-weight:500;color:#15171c}
.chat-item .pv{font-size:12.5px;color:#9a9aa6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.chat-item .rt{font-size:11px;color:#b4b4be;flex:0 0 auto;align-self:flex-start;padding-top:3px}

.vv-tabs{
    position:sticky;bottom:0;left:0;right:0;display:flex;
    background:rgba(250,250,252,.96);
    border-top:1px solid #e2e2e8;z-index:50;backdrop-filter:blur(16px);
    flex-shrink:0;
}
.vv-tabs .tb{
    flex:1;text-align:center;padding:9px 0 12px;font-size:10.5px;color:#8b909a;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.vv-tabs .tb .ti{font-size:19px;line-height:1}
.vv-tabs .tb.on{color:#2a8b48}

.msgs{padding:14px 12px 40px;background:#f2f2f7;flex:1;display:flex;flex-direction:column;gap:11px;min-height:100%}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .body{max-width:73%;display:flex;flex-direction:column;gap:4px}
.msg.me .body{align-items:flex-end}
.msg .who{font-size:11px;color:#9a9aa6;padding-left:3px}
.bub{padding:9px 12px;border-radius:9px;font-size:14px;line-height:1.55;word-break:break-word;background:#fff;color:#15171c}
.msg.me .bub{background:#95ec69}
.bub.transfer{background:#f7a83a;color:#fff;font-weight:500}
.bub.transfer .sub{font-size:11.5px;opacity:.92;font-weight:400;display:block;margin-top:3px}
.sysline{text-align:center;font-size:11.5px;color:#a0a0ac;padding:3px 0}
.sysline.red{color:#d05a5a}
.msg-img{
    width:158px;border-radius:9px;overflow:hidden;background:#dcdfe5;
    cursor:pointer;border:1px solid #d0d3da;
}
.msg-img .cap{background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:4px 8px;text-align:center}

.imgslot{
    width:100%;aspect-ratio:4/3;background:#dfe3ea;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    color:#8a90a0;font-size:12px;position:relative;overflow:hidden;
}
.imgslot img{width:100%;height:100%;object-fit:cover;display:block}
.imgslot .ph{text-align:center;line-height:1.7}

.searchbar{
    display:flex;align-items:center;gap:8px;margin:12px 14px;background:#e6e6ec;
    border-radius:10px;padding:9px 12px;
}
.searchbar input{
    flex:1;border:0;background:transparent;outline:0;font-size:14px;
    font-family:inherit;color:#15171c;
}
.sres{padding:0 14px 30px}
.sres .row{padding:11px 0;border-bottom:1px solid #ececf0;cursor:pointer}
.sres .row .rn{font-size:12px;color:#2a8b48;font-weight:600}
.sres .row .rt{font-size:13.5px;color:#333;margin-top:3px;line-height:1.5}
.sres .row .rr{font-size:11px;color:#b2b2bc;margin-top:3px}
.empty{text-align:center;color:#a8a8b2;font-size:13px;padding:44px 20px;line-height:1.9}

.contact-item{
    display:flex;gap:12px;padding:10px 15px;align-items:center;cursor:pointer;
    background:#fff;border-bottom:1px solid #f3f3f6;transition:.1s;
}
.contact-item:active{background:#f4f4f8}
.contact-item .nm{font-size:14.5px;color:#15171c;font-weight:450}
.contact-item .cl{font-size:11.5px;color:#9a9aa6;margin-top:2px}
.contact-item .tag{
    font-size:10px;color:#2a8b48;background:#e6f5ec;border-radius:4px;
    padding:1px 5px;margin-left:6px;
}
.cg-title{font-size:11.5px;color:#8b909a;padding:12px 16px 6px}

.cd-wrap{min-height:100%;background:#f2f2f7}
.cd-hero{
    background:#fff;padding:26px 18px 20px;display:flex;flex-direction:column;
    align-items:center;gap:10px;border-bottom:1px solid #e8e8ee;
}
.cd-hero .nm{font-size:19px;font-weight:600;color:#15171c}
.cd-hero .cl{font-size:12.5px;color:#8b909a}
.cd-actions{padding:16px}
.cd-actions .btn{width:100%;text-align:center;display:block;margin:8px 0;padding:12px}
.cd-note{padding:0 18px 30px;font-size:12px;color:#9a9aa6;line-height:1.8}

#dialog{
    position:absolute;left:0;right:0;bottom:0;z-index:2200;
    background:rgba(15,17,23,.97);color:#eef1f6;
    padding:20px 22px 30px;border-radius:22px 22px 0 0;
    transform:translateY(130%);
    transition:transform .35s cubic-bezier(.2,.9,.3,1);
    cursor:pointer;box-shadow:0 -8px 36px rgba(0,0,0,.5);
    max-height:70%;overflow-y:auto;
}
#dialog.show{transform:translateY(0)}
.dlg-row{display:flex;gap:11px;align-items:flex-start}
.dlg-body{flex:1;min-width:0}
.dlg-name{font-size:12px;font-weight:700;margin-bottom:5px}
.dlg-text{font-size:15px;line-height:1.72;white-space:pre-wrap}
.dlg-os{
    font-size:14.5px;line-height:1.78;color:#8fd6c6;font-style:italic;
    border-left:2px solid #3f6b62;padding-left:12px;
}
.dlg-tap{text-align:right;font-size:11px;color:#5d6472;margin-top:10px}

#modal{
    position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:2800;
    display:none;align-items:center;justify-content:center;padding:18px;
}
#modal.show{display:flex}
.modal-box{
    background:#fff;width:100%;max-width:340px;max-height:82vh;overflow-y:auto;
    border-radius:16px;padding:16px;box-shadow:0 26px 80px rgba(0,0,0,.5);
}
.modal-box h3{font-size:16px;margin:0 0 10px;color:#15171c}
.modal-box .sm{font-size:12px;color:#8b909a;line-height:1.75}

.banner{
    position:absolute;top:58px;left:14px;right:14px;z-index:2600;
    background:rgba(255,255,255,.98);border-radius:16px;padding:12px 14px;
    display:flex;gap:11px;align-items:center;
    box-shadow:0 10px 32px rgba(0,0,0,.28);
    transform:translateY(-220%);
    transition:transform .48s cubic-bezier(.2,.9,.3,1.16);
    backdrop-filter:blur(14px);
}
.banner.show{transform:translateY(0)}
.banner .bi{
    width:40px;height:40px;border-radius:11px;background:#1677ff;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;
}
.banner .bt{font-size:12.5px;font-weight:700;color:#15171c}
.banner .bd{font-size:12px;color:#5a5f6b;margin-top:2px}

/* 座位表 */
.seatwrap{
    display:flex;gap:7px;margin:12px 0;background:#f7f8fa;
    border:1px solid #e0e2e8;padding:10px;border-radius:9px;
}
.collabel{
    writing-mode:vertical-rl;text-orientation:upright;font-size:11px;
    display:flex;align-items:center;justify-content:center;padding:4px 3px;border-radius:5px;
}
.collabel.win{background:#d6e8f8;color:#3f6790}
.collabel.aisle{background:#f3e2d6;color:#8a5c3a}
.seatrows{flex:1;display:flex;flex-direction:column;gap:5px}
.srow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sseat{
    background:#fff;border:1px solid #dfe2e8;border-radius:5px;
    padding:7px 1px;text-align:center;font-size:10.5px;color:#333;
    transition:.14s;
}
.sseat[data-act]{cursor:pointer}
.sseat[data-act]:active{background:#eef4ff;border-color:#9ab8e0;transform:scale(.96)}
.sseat.me{background:#d9ecff;border-color:#8ab4e8}
.sseat.podium{grid-column:1/-1;background:#eef1f6;font-weight:600;color:#5a6478;padding:6px 0;margin-bottom:3px}

/* 推断按钮 */
.guess{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    border:1px solid #dfe2e8;background:#fafbfd;border-radius:8px;
    padding:11px 13px;margin:8px 0;cursor:pointer;font-size:13.5px;color:#333;
    transition:.14s;
}
.guess:active{background:#eef4ff}
.guess.on{border-color:#3f5d8a;background:#eef4ff;color:#2b4a76;font-weight:600}
.guess .gk{font-weight:600;color:#3f5d8a;flex:0 0 auto}
.guess .gv{text-align:right;font-size:12.5px;line-height:1.5}
.guess.on .gv{color:#2b4a76}

/* 提问选项 */
.qask{
    display:flex;align-items:flex-start;gap:10px;
    border:1px solid #dfe2e8;background:#fafbfd;border-radius:9px;
    padding:12px 13px;margin:9px 0;cursor:pointer;font-size:13.5px;color:#2b3440;
    line-height:1.5;transition:.14s;
}
.qask:active{background:#eef4ff}
.qask.done{border-color:#9dc6a8;background:#f2faf4;color:#3d6b4a}
.qask .qi{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;
    background:#e3e8f0;color:#5a6a82;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.qask.done .qi{background:#6cbf85;color:#fff}

#toast{
    position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);
    background:rgba(22,24,30,.94);color:#eaf0ff;font-size:12.5px;
    padding:10px 17px;border-radius:22px;z-index:2900;
    opacity:0;transition:.3s;pointer-events:none;
    max-width:86%;text-align:center;line-height:1.5;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-height:900px){
    .iphone-screen{height:96vh;max-height:852px}
}
</style>
</head>
<body>

<div class="iphone-screen">
    <div class="dynamic-island" id="island"></div>

    <div class="status-bar">
        <div class="time" id="statusTime">21:47</div>
        <div class="status-right">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="white">
                <rect x="0" y="8" width="3" height="4" rx="1"/>
                <rect x="5" y="5" width="3" height="7" rx="1"/>
                <rect x="10" y="2" width="3" height="10" rx="1"/>
                <rect x="15" y="0" width="3" height="12" rx="1"/>
            </svg>
            <span>5G</span>
            <div class="battery"><div class="battery-level"></div></div>
        </div>
    </div>

    <div class="home-layer" id="homeLayer">
        <div class="task-card" id="taskCard">
            <span id="taskText">打开浏览器，查看侦探部委托板</span>
        </div>

        <div class="app-grid">
            <div class="app" data-act="openApp" data-app="browser">
                <div class="app-icon icon-browser">
                    <svg width="42" height="42" viewBox="0 0 40 40">
                        <circle cx="20" cy="20" r="18" fill="#f2f2f7"/>
                        <circle cx="20" cy="20" r="16" fill="#007aff"/>
                        <circle cx="20" cy="20" r="12" fill="#fff"/>
                        <path d="M20 8 L24 20 L20 32 L16 20 Z" fill="#ff3b30"/>
                        <path d="M8 20 L20 16 L32 20 L20 24 Z" fill="#007aff"/>
                        <circle cx="20" cy="20" r="2" fill="#fff"/>
                    </svg>
                </div>
                <div class="app-name">浏览器</div>
            </div>

            <div class="app" data-act="openApp" data-app="vv">

    document.getElementById('appTitle').textContent = '搜索';

    document.getElementById('appBody').innerHTML =
        `<div class="vv-wrap">
            <div class="searchbar">🔍<input id="sinput" placeholder="搜索聊天记录" autocomplete="off"></div>
            <div class="sres" id="sres"><div class="empty">试试搜索：座位 / 双马尾 / 蒙欢 / 空调</div></div>
            ${vvTabsHTML()}
        </div>`;

    setTimeout(()=>{
        const i = document.getElementById('sinput');
        if(i){ i.addEventListener('input', e=>doSearch(e.target.value)); i.focus(); }
    }, 50);

function doSearch(q){
    const box = document.getElementById('sres');
    if(!box) return;
    q = q.trim();
    if(!q){
        box.innerHTML = '<div class="empty">试试搜索：座位 / 双马尾 / 蒙欢 / 空调</div>';
        return;
    }
    const res = [];
    Object.keys(CHATS).forEach(k=>{
        if(!G.unlockedChats[k]) return;
        const c = CHATS[k];
        c.msgs.forEach(m=>{
            const txt = (m.text || m.cap || '');
            if(txt.indexOf(q) >= 0){
                res.push({chat:k, name:c.name, txt:txt, time:m.time});
            }
        });
    });
    if(res.length === 0){
        box.innerHTML = '<div class="empty">没有找到相关内容。</div>';
        return;
    }
    box.innerHTML = res.map(r=>
        `<div class="row" data-act="jumpChat" data-c="${r.chat}">
            <div class="rn">${r.name}</div>
            <div class="rt">${r.txt}</div>
            <div class="rr">${r.time}</div>
        </div>`
    ).join('');
}

    return `<div class="imgslot"><div class="ph">🖼<br>${id}.jpg<br><span style="font-size:10px;opacity:.7">（图片待插入）</span></div></div>`;

function dialog(lines, onEnd){
    G.dialogQueue = lines.slice();
    G.dialogEnd = onEnd || null;
    const box = document.getElementById('dialog');
    box.classList.add('show');
    box.onclick = dlgNext;
    dlgNext();
}
function dlgNext(){
    const box = document.getElementById('dialog');
    if(G.dialogQueue.length === 0){
        box.classList.remove('show');
        box.onclick = null;
        const cb = G.dialogEnd; G.dialogEnd = null;
        if(cb) setTimeout(cb, 220);
        return;
    }
    const l = G.dialogQueue.shift();
    if(l.os){
        box.innerHTML = `<div class="dlg-os">〔内心OS〕${l.os}</div><div class="dlg-tap">点击继续 ▾</div>`;
    }else{
        const a = AV[l.av] || AV._;
        box.innerHTML = `<div class="dlg-row">${avHTML(l.av,42)}
            <div class="dlg-body">
                <div class="dlg-name" style="color:${a.fg}">${l.who}</div>
                <div class="dlg-text">${l.text}</div>
            </div>
        </div><div class="dlg-tap">点击继续 ▾</div>`;
    }
}

let osTimer;
function os(text){
    let d = document.getElementById('osbox');
    if(!d){
        d = document.createElement('div');
        d.id = 'osbox';
        d.style.cssText =
            'position:absolute;left:50%;bottom:150px;transform:translate(-50%,20px);' +
            'background:rgba(18,28,38,.94);color:#9fd3c7;padding:12px 22px;border-radius:10px;' +
            'font-size:14px;font-style:italic;z-index:2700;opacity:0;pointer-events:none;' +
            'transition:.32s;max-width:86%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.35);';
        document.querySelector('.iphone-screen').appendChild(d);
    }
    d.textContent = '〔内心OS〕' + text;
    d.style.opacity = '1';
    d.style.transform = 'translate(-50%,0)';
    clearTimeout(osTimer);
    osTimer = setTimeout(()=>{

}

/* =========================================================
   十一、事件委托
========================================================= */
document.addEventListener('click', e=>{
    const t = e.target.closest('[data-act]');
    if(!t) return;
    const a = t.dataset.act;

    if(a === 'openApp'){
        openApp(t.dataset.app);
        return;
    }
    if(a === 'disabledApp'){
        toast('这个 App 暂时用不上。');
        return;
    }
    if(a === 'closeApp'){
        closeApp();
        return;
    }

    if(a === 'browserTab'){
        const tab = t.dataset.tab;
        if(tab === 'board' && G.task === 0){
            G.browserTab = 'board';
            setTask(1);
            renderBrowser();
            return;
        }
        G.browserTab = tab;
        renderBrowser();
        return;
    }

    if(a === 'openGuess'){ openGuess(); return; }
    if(a === 'guess'){ doGuess(t.dataset.k); return; }
    if(a === 'confirmGuess'){ confirmGuess(); return; }

    if(a === 'goAct1'){ startAct1(); return; }
    if(a === 'askPanel'){ askPanel(); return; }
    if(a === 'ask'){ askQuestion(t.dataset.k); return; }
    if(a === 'askDone'){ askDone(); return; }

    if(a === 'goAct2'){ startAct2(); return; }
    if(a === 'answer'){ answer(t.dataset.v); return; }
    if(a === 'reopenReport'){ reopenReport(); return; }
    if(a === 'badBack'){ badBack(); return; }
    if(a === 'invoice'){ openInvoice(); return; }
    if(a === 'qr'){ openQR(); return; }
    if(a === 'mail'){ openMail(); return; }
    if(a === 'afterBreakup'){ afterBreakup(); return; }

    if(a === 'pickSeat'){ pickSeat(t.dataset.n); return; }

    if(a === 'openImg'){ openChatImg(t.dataset.id); return; }
    if(a === 'afterShot'){ afterShot(); return; }

    if(a === 'vvTab'){
        G.vvTab = t.dataset.t;
        G.vvChat = null;
        G.vvContact = null;
        G.vvInGroup = false;
        renderVV();
        if(G.vvTab === 'search'){
            setTimeout(()=>{
                const i = document.getElementById('sinput');
                if(i){ i.addEventListener('input', ev=>doSearch(ev.target.value)); i.focus(); }
            }, 50);
        }
        return;
    }

    if(a === 'openChat'){
        G.vvTab = 'chat';
        G.vvChat = t.dataset.c;
        G.vvContact = null;
        G.vvInGroup = false;
        renderVV();
        return;
    }

    if(a === 'groupMembers'){
        if(G.task < 4){
            toast('当前任务：' + TASKS[G.task]);
            return;
        }
        G.vvInGroup = true;
        renderVV();
        return;
    }

    if(a === 'groupMember'){
        const id = t.dataset.c;
        if(!CONTACTS[id]){
            toast('这只是班里的同学，暂时不用联系。');
            return;
        }
        G.vvInGroup = false;
        G.vvTab = 'contact';
        G.vvContact = id;
        renderVV();
        return;
    }

    if(a === 'openContact'){
        G.vvTab = 'contact';
        G.vvContact = t.dataset.c;
        renderVV();
        return;
    }
    if(a === 'addContact'){
        addContact(t.dataset.c);
        return;
    }

    if(a === 'jumpChat'){
        G.vvTab = 'chat';
        G.vvChat = t.dataset.c;
        G.vvContact = null;
        G.vvInGroup = false;
        renderVV();
        return;
    }

    if(a === 'closeModal'){ closeModal(); return; }
});

function openChatImg(id){
    if(id === 'seatmap'){
        if(G.task < 4){
            toast('当前任务：' + TASKS[G.task]);
            return;
        }
        if(G.task === 4) setTask(5);
        openSeatmap();
        return;
    }
    if(id === 'aimeng_shot'){
        openShot();
        return;
    }
    openModal('<h3>图片</h3><div style="border-radius:9px;overflow:hidden">'+imgSlotInner(id)+'</div>' +
        '<div style="text-align:center;margin-top:12px"><button class="btn" data-act="closeModal">关闭</button></div>');
}

function addContact(id){
    const c = CONTACTS[id];
    if(!c) return;
    openModal(
        '<h3 style="margin-top:0">添加到通讯录</h3>' +
        '<div style="display:flex;gap:12px;align-items:center;margin:10px 0 16px">' +
          avHTML(id,54) +
          '<div><b>'+c.name+'</b><br><span class="sm">'+c.cls+'</span></div>' +
        '</div>' +
        '<p class="sm">发送好友申请？</p>' +
        '<div style="text-align:center;margin-top:14px">' +
          '<button class="btn primary" data-act="doAdd" data-c="'+id+'">发送</button>' +
          '<button class="btn" data-act="closeModal">取消</button>' +
        '</div>'
    );
}

async function doAdd(id){
    closeModal();
    openModal('<h3 style="margin-top:0">已发送好友申请</h3><p class="sm">等待对方通过……</p>');
    await sleep(1200);
    closeModal();
    G.unlockedChats[id] = true;
    expandIsland();
    showBanner('VV', CONTACTS[id].name + ' 已通过你的好友申请', '💬');
    renderVV();
}

document.getElementById('modal').addEventListener('click', e=>{
    if(e.target.id === 'modal' && G.task < 9 && !G.modalLock) closeModal();
});

/* =========================================================
   十二、启动
========================================================= */
renderCalendar();
updateTaskCard();
setTimeout(()=>{ os('诶，这种事也管的吗。'); }, 900);
</script>
</body>
